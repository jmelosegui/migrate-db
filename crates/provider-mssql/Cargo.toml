[package]
name = "migrate-db-mssql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Integration tests against a real SQL Server (needs MIGRATE_DB_TEST_MSSQL).
integration = []

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
# Entra ID tokens (az login locally; managed / workload identity in pipelines). Stable 1.x.
azure_core = { version = "1.1.0" }
azure_identity = { version = "1.0.0", features = ["tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
migrate-db-core = { version = "0.1.0", path = "../core" }
# Pinned exactly: pre-1.0, breaking minor releases; wrapped in src/client.rs (ADR-0004).
mssql-tds = "=0.4.0"
thiserror = "2.0.21"
# Bound the wait for each Entra credential source.
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.2.1"

[dev-dependencies]
migrate-db-conformance = { path = "../conformance" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
