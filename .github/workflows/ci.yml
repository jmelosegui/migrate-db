name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # mssql-tds needs the Network framework (macOS 10.15+); ignored on other OSes.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p migrate-db --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace
